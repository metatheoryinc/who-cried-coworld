<!doctype html>
<html lang="en" data-proto="wcw-spectator">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who Cried Wolf — spectator design prototype</title>
<style>
/* ============================================================================
   Tokens. One source for every visual decision in this prototype. These become
   the seed of the shared design system, not per-screen values.
   ========================================================================= */
:root {
  --ground:      #131017;
  --surface:     #1b1822;
  --surface-2:   #23202d;
  --surface-3:   #2b2736;
  --line:        #342f40;
  --line-soft:   #262232;

  --text:        #ecebf2;
  --text-dim:    #aaa3b9;
  --text-faint:  #7d7690;

  --lamp:        #f0b95c;   /* day, focus, live */
  --moon:        #8aa7da;   /* night */
  --wolf:        #e2716f;   /* wolf faction */
  --town:        #79c9ac;   /* town faction */
  --seal:        #b394f0;   /* revealed-in-replay */
  --gone:        #6b6478;   /* eliminated */

  --lamp-bg:  rgba(240,185,92,.12);
  --moon-bg:  rgba(138,167,218,.12);
  --wolf-bg:  rgba(226,113,111,.14);
  --town-bg:  rgba(121,201,172,.13);
  --seal-bg:  rgba(179,148,240,.10);

  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px;

  --r1: 6px;  --r2: 10px; --r3: 14px;

  --ui: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --voice: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;

  --rail: 296px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow-x: clip;
  background: var(--ground);
  color: var(--text);
  font: 15px/1.55 var(--ui);
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; min-height: 100vh;
}

button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; border-radius: var(--r1); }

/* ---------------------------------------------------------------- prototype
   Scaffolding only. Not part of the product surface. In the real application
   the source is determined by context (live episode vs. static replay bundle);
   only the Reveal control below is a real product control.                  */
.protobar {
  display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap;
  padding: var(--s2) var(--s4);
  background: repeating-linear-gradient(135deg, #191622 0 10px, #1d1a26 10px 20px);
  border-bottom: 1px solid var(--line);
  font-size: 12px; color: var(--text-faint);
}
.protobar strong { color: var(--text-dim); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 11px; }
.protobar .spacer { flex: 1 1 auto; }

/* ------------------------------------------------------------------ chrome */
.masthead {
  display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap;
  padding: var(--s4) var(--s5);
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #1a1722, var(--ground));
}
.brand { display: flex; flex-direction: column; gap: 2px; margin-right: auto; }
.brand h1 { margin: 0; font: 600 19px/1.2 var(--voice); letter-spacing: .01em; }
.brand .sub { font-size: 12px; color: var(--text-faint); letter-spacing: .02em; }

.status {
  display: inline-flex; align-items: center; gap: var(--s2);
  padding: 5px 11px 5px 9px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface);
  font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
}
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); }
.status[data-live="true"] { color: var(--lamp); border-color: rgba(240,185,92,.4); background: var(--lamp-bg); }
.status[data-live="true"] .dot { background: var(--lamp); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

/* segmented control — used for both the prototype source and the Reveal control */
.seg { display: inline-flex; padding: 3px; gap: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.seg button {
  appearance: none; border: 0; background: transparent; color: var(--text-dim);
  padding: 6px 13px; border-radius: 999px; cursor: pointer;
  font-size: 13px; font-weight: 500; white-space: nowrap;
}
.seg button:hover:not([disabled]) { color: var(--text); background: var(--surface-3); }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.seg button[disabled] { opacity: .38; cursor: not-allowed; }
.seg[data-kind="reveal"] button[aria-pressed="true"][value="omniscient"] { color: var(--seal); box-shadow: inset 0 0 0 1px rgba(179,148,240,.45); background: var(--seal-bg); }

.control { display: flex; flex-direction: column; gap: 5px; }
.control > .label { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--text-faint); font-weight: 600; padding-left: 2px; }
.control .hint { font-size: 11.5px; color: var(--text-faint); padding-left: 2px; }

/* ------------------------------------------------------------------- stage */
.stage {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  gap: var(--s5);
  padding: var(--s5);
  align-items: start;
}

/* -------------------------------------------------------------- seat rail */
.rail { position: sticky; top: var(--s4); display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }
.rail > .head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 var(--s1); }
.rail > .head h2 { margin: 0; font: 600 13px/1 var(--ui); letter-spacing: .09em; text-transform: uppercase; color: var(--text-faint); }
.rail > .head .count { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.seats { display: flex; flex-direction: column; gap: var(--s2); margin: 0; padding: 0; list-style: none; min-width: 0; }

.seat { min-width: 0; border: 1px solid var(--line-soft); border-radius: var(--r2); background: var(--surface); overflow: hidden; }
.seat > summary {
  display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: var(--s3);
  align-items: center; padding: var(--s2) var(--s3); cursor: pointer; list-style: none;
}
.seat > summary::-webkit-details-marker { display: none; }
.seat > summary:hover { background: var(--surface-2); }
.seat[data-speaking="true"] { border-color: rgba(240,185,92,.55); background: linear-gradient(90deg, var(--lamp-bg), var(--surface) 62%); }
.seat[data-alive="false"] { background: #17151d; border-color: #221f2a; }
.seat[data-alive="false"] .nm { color: var(--gone); text-decoration: line-through; text-decoration-thickness: 1px; }
.seat[data-alive="false"] .avatar { filter: grayscale(1); opacity: .5; }
.seat[data-alive="false"] .badge { opacity: .55; }

.avatar {
  width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
  font: 600 14px var(--voice); color: #14111a; background: var(--av, #8d86a0);
}
.avatar[data-kind="submitted"] {
  color: var(--text-dim); background: transparent;
  border: 1px dashed var(--line); font-family: var(--ui); font-size: 11px; letter-spacing: .02em;
}
.seat .who { min-width: 0; }
.seat .nm { display: block; font-weight: 600; font-size: 14px; letter-spacing: .01em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat .st { display: block; font-size: 11.5px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat .tail { display: flex; align-items: center; gap: 6px; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase; border: 1px solid transparent; white-space: nowrap;
}
.badge[data-faction="wolf"] { color: var(--wolf); background: var(--wolf-bg); border-color: rgba(226,113,111,.35); }
.badge[data-faction="town"] { color: var(--town); background: var(--town-bg); border-color: rgba(121,201,172,.32); }
.badge[data-tone="seal"]    { color: var(--seal); background: var(--seal-bg); border-color: rgba(179,148,240,.35); }
.badge[data-tone="quiet"]   { color: var(--text-faint); background: var(--surface-2); border-color: var(--line); }
.badge[data-tone="lamp"]    { color: var(--lamp); background: var(--lamp-bg); border-color: rgba(240,185,92,.35); }

.seat .detail { padding: 0 var(--s3) var(--s3); border-top: 1px solid var(--line-soft); margin-top: var(--s1); padding-top: var(--s3); }
.seat .detail p { margin: 0 0 var(--s2); font-size: 12.5px; color: var(--text-dim); }
.seat .detail p.persona { font-family: var(--voice); font-style: italic; color: var(--text-dim); }
.seat .detail dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px var(--s3); font-size: 12px; }
.seat .detail dt { color: var(--text-faint); }
.seat .detail dd { margin: 0; color: var(--text-dim); }

/* ------------------------------------------------------------------- floor */
.floor { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }
/* Column flex items default to flex-shrink:1. Inside a scrolling column that
   silently squashes every beat, and clips any beat with overflow:hidden to
   nothing. Beats are content-sized, always. */
.floor > *, .seats > * { flex: 0 0 auto; }

.beat { border-radius: var(--r2); }

/* phase banner */
.phase {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s3) var(--s4); border-radius: var(--r2);
  border: 1px solid var(--line-soft); background: var(--surface);
  margin-top: var(--s3);
}
.phase:first-child { margin-top: 0; }
.phase .mark { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 4px 9px; border-radius: var(--r1); }
.phase[data-phase="day"]  .mark, .phase[data-phase="vote"] .mark { color: var(--lamp); background: var(--lamp-bg); }
.phase[data-phase="night"] .mark { color: var(--moon); background: var(--moon-bg); }
.phase[data-phase="finished"] .mark { color: var(--text-dim); background: var(--surface-3); }
.phase .narr { font-family: var(--voice); font-size: 15.5px; color: var(--text-dim); }
.phase[data-phase="night"] { background: linear-gradient(90deg, var(--moon-bg), var(--surface) 55%); }

/* speech */
.speech { display: grid; grid-template-columns: 38px minmax(0,1fr); gap: var(--s3); padding: var(--s3) var(--s4) var(--s4); border: 1px solid var(--line-soft); background: var(--surface); }
.speech .avatar { width: 38px; height: 38px; font-size: 15px; }
.speech .hdr { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; margin-bottom: 3px; }
.speech .hdr .nm { font-weight: 600; font-size: 14.5px; }
.speech .hdr .seat-no { font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
.speech .reply { font-size: 11.5px; color: var(--text-faint); }
.speech .body { font-family: var(--voice); font-size: 16.5px; line-height: 1.58; color: var(--text); margin: 0; }
.speech .meta { display: flex; gap: var(--s2); flex-wrap: wrap; margin-top: var(--s3); }

/* revealed block — one treatment for every post-game reveal */
.sealed {
  border: 1px solid rgba(179,148,240,.26); border-left: 3px solid var(--seal);
  background: linear-gradient(90deg, var(--seal-bg), var(--surface) 70%);
  padding: var(--s3) var(--s4) var(--s4);
}
.sealed > .hdr { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s3); }
.sealed { padding: var(--s3) var(--s4); }
.sealed > .hdr h3 { margin: 0; font: 600 12.5px/1 var(--ui); letter-spacing: .07em; text-transform: uppercase; color: var(--seal); }
.sealed .note { margin: var(--s3) 0 0; font-size: 12px; color: var(--text-faint); font-style: italic; }
.sealed ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--s3); }
.line { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: var(--s3); align-items: start; }
.line .avatar { width: 26px; height: 26px; border-radius: 7px; font-size: 11px; }
.line .nm { font-weight: 600; font-size: 13px; }
.line .txt { font-family: var(--voice); font-size: 15px; color: var(--text-dim); margin: 2px 0 0; }
.line .txt strong { color: var(--text); font-weight: 600; font-family: var(--ui); font-size: 13px; }
.line .sub { font-size: 11.5px; color: var(--text-faint); margin-top: 3px; }

/* night scene — the whole of a night is one thing the public never saw, so it is
   one container, not six equal panels stacked into a lavender wall. */
.scene {
  border: 1px solid rgba(179,148,240,.22); border-radius: var(--r3); overflow: hidden;
  background: linear-gradient(180deg, rgba(138,167,218,.06), var(--surface) 240px);
  margin-top: var(--s3);
}
.scene > header {
  position: sticky; top: 0; z-index: 1; backdrop-filter: blur(6px);
  display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
  padding: var(--s3) var(--s4);
  background: #221f2e; border-bottom: 1px solid rgba(179,148,240,.2);
}
.scene > header .mark { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--moon); }
.scene > header .narr { font-family: var(--voice); font-size: 15.5px; color: var(--text-dim); margin-right: auto; }
.scene .sect { padding: var(--s4); border-top: 1px solid var(--line-soft); }
.scene .sect:first-child { border-top: 0; }
.scene .sect > h4 {
  margin: 0 0 var(--s3); font: 700 11px/1 var(--ui); letter-spacing: .1em;
  text-transform: uppercase; color: var(--seal);
}
.scene .sect > .note { margin: var(--s3) 0 0; font-size: 12px; color: var(--text-faint); font-style: italic; }
.scene .sect ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--s3); }
.verdict { font-weight: 700; font-family: var(--ui); font-size: 13px; letter-spacing: .04em; }
.verdict[data-v="wolf"] { color: var(--wolf); }
.verdict[data-v="not_wolf"] { color: var(--town); }
.verdict[data-v="no_result"] { color: var(--text-faint); }

/* vote tally */
.tally { border: 1px solid var(--line-soft); background: var(--surface); padding: var(--s4); }
.tally > h3 { margin: 0 0 var(--s3); font: 600 12.5px/1 var(--ui); letter-spacing: .07em; text-transform: uppercase; color: var(--text-faint); }
.bars { display: flex; flex-direction: column; gap: var(--s2); margin-bottom: var(--s4); }
.bar { display: grid; grid-template-columns: 96px minmax(0,1fr) 28px; gap: var(--s3); align-items: center; font-size: 13px; }
.bar .n { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { display: block; height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.bar .fill { display: block; height: 100%; background: var(--text-faint); border-radius: 999px; }
.bar[data-out="true"] .n { color: var(--text); font-weight: 600; }
.bar[data-out="true"] .fill { background: var(--wolf); }
.bar[data-abstain="true"] .track { background: repeating-linear-gradient(90deg, var(--surface-3) 0 5px, transparent 5px 10px); }
.bar[data-abstain="true"] .fill { background: var(--line); }
.bar .c { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-dim); }
.ballots { display: flex; flex-wrap: wrap; gap: var(--s2); }
.ballot { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line-soft); font-size: 12px; color: var(--text-dim); }
.ballot .arrow { color: var(--text-faint); }
.ballot[data-abstain="true"] { border-style: dashed; color: var(--text-faint); }

/* elimination + dawn */
.knell { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border: 1px solid var(--line-soft); background: var(--surface-2); }
.knell .glyph { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-3); color: var(--text-faint); font-size: 15px; }
.knell .txt { font-family: var(--voice); font-size: 15.5px; color: var(--text-dim); }
.knell .txt b { color: var(--text); font-weight: 600; }
.knell[data-cause="night"] .glyph { color: var(--moon); background: var(--moon-bg); }
.knell[data-cause="vote"]  .glyph { color: var(--lamp); background: var(--lamp-bg); }

/* night hold — the designed empty state of a public live night */
.hold {
  border: 1px dashed var(--line); background: linear-gradient(180deg, rgba(138,167,218,.05), transparent);
  padding: var(--s6) var(--s4); text-align: center; border-radius: var(--r2);
}
.hold .big { font-family: var(--voice); font-size: 17px; color: var(--text-dim); margin: 0 0 var(--s2); }
.hold .why { font-size: 12.5px; color: var(--text-faint); max-width: 46ch; margin: 0 auto; }

/* outcome */
.outcome { border: 1px solid var(--line); background: linear-gradient(180deg, var(--surface-2), var(--surface)); padding: var(--s5); }
.outcome h2 { margin: 0 0 var(--s2); font: 600 24px/1.2 var(--voice); }
.outcome .detail { margin: 0 0 var(--s4); color: var(--text-dim); font-family: var(--voice); font-size: 16px; }
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: var(--s2); }
.rrow { display: flex; align-items: center; gap: var(--s2); padding: var(--s2); border-radius: var(--r1); background: var(--surface); border: 1px solid var(--line-soft); font-size: 12.5px; }
.rrow .avatar { width: 24px; height: 24px; border-radius: 6px; font-size: 10px; }
.rrow .nm { font-weight: 600; }
.rrow .sc { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--text-faint); }

/* --------------------------------------------------------------- transport */
.transport {
  flex: 0 0 auto; z-index: 5;
  display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap;
  padding: var(--s3) var(--s5) calc(var(--s3) + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line); background: rgba(19,16,23,.94); backdrop-filter: blur(8px);
}
.tbtn { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r1); padding: 7px 11px; cursor: pointer; font-size: 13px; }
.tbtn:hover { background: var(--surface-3); }
.timeline { flex: 1 1 320px; min-width: 200px; display: flex; flex-direction: column; gap: 6px; }
.segments { display: flex; gap: 2px; height: 8px; }
.segments .sgm { border-radius: 2px; background: var(--surface-3); }
.segments .sgm[data-phase="day"], .segments .sgm[data-phase="vote"] { background: rgba(240,185,92,.3); }
.segments .sgm[data-phase="night"] { background: rgba(138,167,218,.3); }
.segments .sgm[data-past="true"] { filter: brightness(1.9); }
.timeline input[type="range"] { width: 100%; accent-color: var(--lamp); margin: 0; }
.tlabel { font-size: 12px; color: var(--text-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
#livebar { white-space: normal; flex: 1 1 200px; min-width: 0; }

/* ------------------------------------------------------- dependency drawer */
.deps { flex: 0 0 auto; margin: var(--s3) var(--s5) 0; border: 1px solid var(--line-soft); border-radius: var(--r2); background: var(--surface); }
.deps summary { cursor: pointer; padding: var(--s3) var(--s4); font-size: 12.5px; color: var(--text-dim); font-weight: 600; letter-spacing: .04em; }
.deps .in { padding: 0 var(--s4) var(--s4); font-size: 12.5px; color: var(--text-faint); display: grid; gap: var(--s3); }
.deps table { border-collapse: collapse; font-size: 12px; }
.deps td, .deps th { text-align: left; padding: 3px var(--s4) 3px 0; color: var(--text-dim); font-weight: 400; vertical-align: top; }
.deps th { color: var(--text-faint); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; font-size: 10.5px; }
.deps code { color: var(--seal); font-size: 11.5px; }
.deps ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 5px; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ------------------------------------------------------------- responsive */
/* Wide screens are an app shell: the fold and the transport hold still, the
   floor scrolls. Narrow screens fall back to ordinary page flow. */
@media (min-width: 1001px) {
  body { height: 100vh; overflow: hidden; }
  .stage { flex: 1 1 auto; min-height: 0; align-items: stretch;
           grid-template-rows: minmax(0, 1fr); padding-bottom: var(--s4); }
  .rail  { position: static; min-height: 0; overflow-y: auto; padding-right: 2px; }
  .floor { min-height: 0; overflow-y: auto; padding-right: var(--s2); }
}
@media (max-width: 1000px) {
  .stage { grid-template-columns: minmax(0,1fr); gap: var(--s4); padding: var(--s4); }
  .rail { position: static; }
  .seats { flex-direction: row; overflow-x: auto; overscroll-behavior-x: contain;
           padding-bottom: var(--s2); scroll-snap-type: x mandatory; }
  .seats > li { flex: 0 0 210px; scroll-snap-align: start; }
  .seat .detail { display: none; }
}
@media (max-width: 620px) {
  .masthead { padding: var(--s3) var(--s4); gap: var(--s3); }
  .brand { flex: 1 0 100%; }
  .stage { padding: var(--s3); }
  .speech { grid-template-columns: minmax(0,1fr); }
  .speech > .avatar { display: none; }
  .bar { grid-template-columns: 76px minmax(0,1fr) 24px; }
  .transport { padding: var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom, 0px)); }
  .deps { margin: var(--s2) var(--s3) 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="protobar" role="region" aria-label="Prototype controls">
  <strong>Prototype</strong>
  <span>Simulated source (the real product does not offer this choice):</span>
  <span class="seg" data-kind="source" role="group" aria-label="Simulated source">
    <button type="button" value="live">Live episode</button>
    <button type="button" value="replay">Completed replay</button>
  </span>
  <span class="spacer"></span>
  <span id="protohint"></span>
</div>

<details class="deps">
  <summary>What this browser is holding &middot; unreconciled dependencies</summary>
  <div class="in">
    <div id="census"></div>
    <ul id="deps"></ul>
  </div>
</details>

<header class="masthead">
  <div class="brand">
    <h1 id="ep-title">—</h1>
    <span class="sub" id="ep-sub">—</span>
  </div>

  <span class="status" id="status"><span class="dot"></span><span id="status-text">—</span></span>

  <div class="control">
    <span class="label" id="reveal-label">Reveal</span>
    <span class="seg" data-kind="reveal" role="group" aria-labelledby="reveal-label">
      <button type="button" value="aired">As it aired</button>
      <button type="button" value="omniscient">Everything</button>
    </span>
    <span class="hint" id="reveal-hint"></span>
  </div>
</header>

<div class="stage">
  <aside class="rail" aria-label="The fold">
    <div class="head">
      <h2>The fold</h2>
      <span class="count" id="alive-count">—</span>
    </div>
    <ul class="seats" id="seats"></ul>
  </aside>

  <main class="floor" id="floor" aria-label="Episode floor" aria-live="polite" aria-relevant="additions"></main>
</div>

<footer class="transport" id="transport">
  <button class="tbtn" id="play" type="button" aria-label="Play or pause">▶</button>
  <button class="tbtn" id="prev" type="button" aria-label="Previous beat">◀</button>
  <button class="tbtn" id="next" type="button" aria-label="Next beat">▶|</button>
  <div class="timeline">
    <div class="segments" id="segments" aria-hidden="true"></div>
    <label class="sr" for="scrub">Episode position</label>
    <input type="range" id="scrub" min="1" value="1" step="1">
  </div>
  <span class="tlabel" id="tlabel">—</span>
  <span class="tlabel" id="livebar" hidden>Live &middot; the timeline becomes scrubbable when the episode completes and its replay is published.</span>
</footer>

<script src="fixtures/live-public.js"></script>
<script src="fixtures/replay-export.js"></script>
<script>
/* ============================================================================
   Presentation fold.

   The page is handed two already-projected artifacts. LIVE_PUBLIC is what a
   public spectator's socket delivers while the episode runs; REPLAY_EXPORT is
   the completed static bundle. Neither is filtered here for secrecy — that
   already happened, in project.mjs, on the trusted side.

   The Reveal control below therefore chooses what to DRAW from bytes the viewer
   already has. It is a viewing preference, not a lock.
   ========================================================================= */

const state = {
  source: 'replay',    // 'live' | 'replay' — context in the real product
  reveal: 'aired',     // 'aired' | 'omniscient' — the one real viewer control
  cursor: Infinity,
  playing: false,
};

const data = () => (state.source === 'live' ? LIVE_PUBLIC : REPLAY_EXPORT);
const seatsOf = () => data().seats;
const maxSeq = () => data().events.length;
const seat = n => seatsOf()[n];
const nameOf = n => seat(n).name;

const ROLE_LABEL = { wolf: 'Wolf', alchemist: 'Alchemist', seer: 'Seer', guard: 'Guard', sheep: 'Sheep' };
const FACTION = { wolf: 'wolf', alchemist: 'wolf', seer: 'town', guard: 'town', sheep: 'town' };
const ABILITY = { kill: 'Kill', block: 'Block', inspect: 'Inspect', protect: 'Protect' };
const REVEAL_LABEL = {
  discarded_bids: 'discarded bids', confessional: 'confessionals', wolf_chat: 'wolf chat',
  night_choices: 'night choices and results', failures: 'fallbacks', roles: 'roles',
  public: 'delivered live to everyone',
};
const HUES = [18, 42, 96, 352, 212, 320, 272, 150, 8];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* Drawing rule. Not a secrecy rule — everything it can return is already local. */
function visible(e) {
  if (e.seq > state.cursor) return false;
  if (e.reveal === 'public') return true;
  return state.source === 'replay' && state.reveal === 'omniscient';
}

function shown() { return data().events.filter(visible); }

/* Roles are drawn when the viewer asked for everything, or when the episode's own
   public ending has been reached. The winning faction is derivable from per-seat
   scores, so withholding roles after a published result would be theatre. */
function rolesKnown(evs) {
  if (!seatsOf().some(s => 'role' in s)) return false;
  if (state.source === 'replay' && state.reveal === 'omniscient') return true;
  return evs.some(e => e.kind === 'outcome');
}

function derive(evs) {
  const S = seatsOf();
  const m = {
    alive: S.map(() => true), died: S.map(() => null),
    speaking: null, accused: S.map(() => 0),
    lastBallot: S.map(() => undefined), spoke: S.map(() => 0),
    day: 0, phase: 'waiting', roles: rolesKnown(evs), finished: false,
  };
  for (const e of evs) {
    if (e.kind === 'phase') { m.day = e.day; m.phase = e.phase; m.speaking = null; }
    if (e.kind === 'speech') { m.speaking = e.slot; m.spoke[e.slot]++; if (e.accusation !== null && e.accusation !== undefined) m.accused[e.accusation]++; }
    if (e.kind === 'vote_close') { m.lastBallot = S.map(() => undefined); e.ballots.forEach(b => m.lastBallot[b.slot] = b.target); }
    if (e.kind === 'elimination') { m.alive[e.slot] = false; m.died[e.slot] = { cause: e.cause, day: e.day }; if (m.speaking === e.slot) m.speaking = null; }
    // a dawn announcement is how a night death becomes public; it is the same state change
    if (e.kind === 'death_notice') { m.alive[e.slot] = false; m.died[e.slot] = { cause: 'night', day: e.day }; }
    if (e.kind === 'outcome') { m.finished = true; m.phase = 'finished'; }
  }
  return m;
}

/* ------------------------------------------------------------------ pieces */

function avatar(n, cls) {
  const s = seat(n);
  if (s.kind === 'submitted')
    return `<span class="avatar ${cls || ''}" data-kind="submitted" aria-hidden="true">${esc(String(n))}</span>`;
  return `<span class="avatar ${cls || ''}" style="--av:hsl(${HUES[n]} 46% 66%)" aria-hidden="true">${esc(s.name[0])}</span>`;
}

function roleBadge(n) {
  const r = seat(n).role;
  if (!r) return '';
  return `<span class="badge" data-faction="${FACTION[r]}">${esc(ROLE_LABEL[r])}</span>`;
}

function renderSeats(m) {
  const S = seatsOf();
  document.getElementById('alive-count').textContent = `${m.alive.filter(Boolean).length} of ${S.length} alive`;

  document.getElementById('seats').innerHTML = S.map(s => {
    const n = s.slot, gone = m.died[n];
    let st;
    if (gone) st = gone.cause === 'vote' ? `Voted out, day ${gone.day}` : `Lost in night ${gone.day - 1}`;
    else if (m.speaking === n) st = 'Has the floor';
    else if (m.lastBallot[n] !== undefined) st = m.lastBallot[n] === null ? 'Abstained' : `Voted ${nameOf(m.lastBallot[n])}`;
    else st = s.kind === 'submitted' ? 'Submitted policy' : 'In the fold';

    const tail = [];
    if (m.speaking === n && !gone) tail.push('<span class="badge" data-tone="lamp">Speaking</span>');
    if (m.roles) tail.push(roleBadge(n));
    else if (m.accused[n] > 0) tail.push(`<span class="badge" data-tone="quiet">${m.accused[n]}&times; named</span>`);

    const detail = s.persona
      ? `<p class="persona">${esc(s.persona)}</p>`
      : `<p>Submitted policy. This seat is known by its configured display name and nothing else &mdash; no personality, no provider, no model.</p>`;

    return `<li><details class="seat" data-alive="${!gone}" data-speaking="${m.speaking === n && !gone}">
      <summary>
        ${avatar(n)}
        <span class="who"><span class="nm">${esc(s.name)}</span><span class="st">Seat ${n} &middot; ${esc(st)}</span></span>
        <span class="tail">${tail.join('')}</span>
      </summary>
      <div class="detail">${detail}
        <dl><dt>Seat</dt><dd>${n}</dd>
          <dt>Spoke</dt><dd>${m.spoke[n]} time${m.spoke[n] === 1 ? '' : 's'}</dd>
          <dt>Status</dt><dd>${esc(st)}</dd>
          ${m.roles && s.role ? `<dt>Role</dt><dd>${esc(ROLE_LABEL[s.role])} &middot; ${FACTION[s.role] === 'wolf' ? 'Wolf faction' : 'Town'}</dd>` : ''}
        </dl>
      </div>
    </details></li>`;
  }).join('');
}

function speechBeat(e, all) {
  const meta = [];
  if (e.accusation !== null && e.accusation !== undefined)
    meta.push(`<span class="badge" data-tone="quiet">Names ${esc(nameOf(e.accusation))}</span>`);
  const src = e.replyTo ? all.find(x => x.seq === e.replyTo) : null;
  return `<article class="beat speech">
    ${avatar(e.slot)}
    <div>
      <div class="hdr">
        <span class="nm">${esc(nameOf(e.slot))}</span>
        <span class="seat-no">Seat ${e.slot}</span>
        ${src ? `<span class="reply">&#8618; replying to ${esc(nameOf(src.slot))}</span>` : ''}
      </div>
      <p class="body">${esc(e.text)}</p>
      ${meta.length ? `<div class="meta">${meta.join('')}</div>` : ''}
    </div>
  </article>`;
}

function tallyBeat(e) {
  const counts = new Map();
  let abstain = 0;
  e.ballots.forEach(b => b.target === null ? abstain++ : counts.set(b.target, (counts.get(b.target) || 0) + 1));
  const rows = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0] - b[0]);
  if (abstain) rows.push(['abstain', abstain]);
  const top = Math.max(1, ...rows.map(r => r[1]));
  return `<section class="beat tally">
    <h3>Ballots &middot; day ${e.day} &middot; majority ${e.majority} of ${e.ballots.length}</h3>
    <div class="bars">${rows.map(([t, c]) => `
      <div class="bar" data-out="${t === e.eliminated}" data-abstain="${t === 'abstain'}">
        <span class="n">${t === 'abstain' ? 'Abstained' : esc(nameOf(t))}</span>
        <span class="track"><span class="fill" style="width:${(c / top) * 100}%"></span></span>
        <span class="c">${c}</span>
      </div>`).join('')}
    </div>
    <div class="ballots">${e.ballots.map(b => `
      <span class="ballot" data-abstain="${b.target === null}">
        ${esc(nameOf(b.slot))} <span class="arrow">&rarr;</span> ${b.target === null ? 'no one' : esc(nameOf(b.target))}
      </span>`).join('')}
    </div>
  </section>`;
}

function knell(e, rolesShown) {
  const night = e.kind === 'death_notice';
  const txt = night
    ? `At first light, <b>${esc(nameOf(e.slot))}</b> was gone.`
    : `<b>${esc(nameOf(e.slot))}</b> was voted out of the fold.`;
  return `<article class="beat knell" data-cause="${night ? 'night' : 'vote'}">
    <span class="glyph" aria-hidden="true">${night ? '&#9790;' : '&#10005;'}</span>
    <span class="txt">${txt}${rolesShown ? '' : ' <span style="color:var(--text-faint)">Their role stays secret until the episode ends.</span>'}</span>
  </article>`;
}

function sealed(tag, inner, note) {
  return `<section class="beat sealed">
    <div class="hdr"><h3>${esc(tag)}</h3><span class="badge" data-tone="seal">Hidden during play</span></div>
    ${inner}
    ${note ? `<p class="note">${esc(note)}</p>` : ''}
  </section>`;
}

function lineOf(n, main, sub) {
  return `<li class="line">${avatar(n)}<div>
    <span class="nm">${esc(nameOf(n))}</span>
    <p class="txt">${main}</p>
    ${sub ? `<div class="sub">${sub}</div>` : ''}
  </div></li>`;
}

/* Consecutive private events of the same kind are one panel, not one panel each.
   A wolf conversation reads as a conversation; five headers read as a log file. */
function coalesce(evs) {
  const GROUPABLE = { wolf_chat: 1, night_action: 1, deliberation: 1 };
  const out = [];
  for (const e of evs) {
    const prev = out[out.length - 1];
    const same = prev && prev.kind === e.kind && prev.day === e.day && prev.phase === e.phase
      && (e.kind !== 'deliberation' || prev.label === e.label);
    if (GROUPABLE[e.kind] && same) { prev.group.push(e); continue; }
    out.push(GROUPABLE[e.kind] ? { ...e, group: [e] } : e);
  }
  return out;
}

function revealParts(e) {
  switch (e.kind) {
    case 'wolf_chat':
      return { title: 'Wolf channel',
        inner: `<ul>${e.group.map(w => lineOf(w.slot, esc(w.text), `Turn ${w.turn}`)).join('')}</ul>`,
        note: 'Delivered only to the living wolf faction, one turn at a time.' };

    case 'bids':
      return { title: `${e.items.length} bids not taken · window ${e.window}`,
        inner: `<ul>${e.items.map(b => lineOf(b.slot, esc(b.text),
          `Ranked ${b.rank} &middot; urgency ${b.urgency} &middot; ${esc(b.reason)}`)).join('')}</ul>`,
        note: e.note };

    case 'deliberation':
      return { title: e.label === 'Confessional' ? 'Confessionals' : 'Why they voted',
        inner: `<ul>${e.group.map(i => lineOf(i.slot, esc(i.text))).join('')}</ul>`,
        note: 'Written by each policy for the audience as part of a committed action. Not model reasoning.' };

    case 'night_action':
      return { title: 'Night actions',
        inner: `<ul>${e.group.map(n => {
          const acts = n.actions.filter(a => a.target !== null)
            .map(a => `<strong>${ABILITY[a.ability]}</strong> &rarr; ${esc(nameOf(a.target))}`).join(' &nbsp;·&nbsp; ');
          const passed = n.actions.filter(a => a.target === null).map(a => ABILITY[a.ability]).join(', ');
          return lineOf(n.slot, acts || '<strong>Passed</strong>', passed ? `Offered but passed: ${passed}` : '');
        }).join('')}</ul>`,
        note: 'Every living seat received the night request at the same moment, including seats with nothing to do.' };

    case 'night_pass':
      return { title: 'Nothing to do',
        inner: `<p class="txt" style="margin:0;color:var(--text-dim);font-family:var(--voice);font-size:15px">${e.slots.map(nameOf).map(esc).join(', ')} had no ability to use.</p>`,
        note: e.note };

    case 'night_result': {
      const v = { wolf: 'Wolf', not_wolf: 'Not a wolf', no_result: 'No result' }[e.result];
      return { title: 'Private result',
        inner: `<ul>${lineOf(e.slot, `<strong>${ABILITY[e.ability]} ${esc(nameOf(e.target))}</strong> &rarr; <span class="verdict" data-v="${e.result}">${v}</span>`)}</ul>`,
        note: e.note };
    }

    case 'resolution':
      return { title: 'How the night resolved',
        inner: `<p class="txt" style="margin:0;color:var(--text-dim);font-family:var(--voice);font-size:15px">${esc(e.text)}</p>`,
        note: null };

    case 'failure':
      return { title: 'Fallback',
        inner: `<ul>${lineOf(e.slot, `<strong>${esc(e.request)} &middot; ${esc(e.code)}</strong> &mdash; ${esc(e.fallback)}`,
          e.provenance === 'server_fallback'
            ? 'The game applied a legal fallback'
            : 'The policy reported a failure and supplied a legal action')}</ul>`,
        note: e.note };
  }
  return null;
}

function revealBeat(e) { const p = revealParts(e); return p ? sealed(p.title, p.inner, p.note) : ''; }

/* A night has no public content to interleave with, so it is one scene. */
function nightScene(banner, body) {
  const sects = body.map(e => {
    const p = revealParts(e);
    return p ? `<div class="sect"><h4>${esc(p.title)}</h4>${p.inner}${p.note ? `<p class="note">${esc(p.note)}</p>` : ''}</div>` : '';
  }).join('');
  return `<section class="beat scene">
    <header>
      <span class="mark">Night ${banner.day}</span>
      <span class="narr">${esc(banner.text)}</span>
      <span class="badge" data-tone="seal">Hidden during play</span>
    </header>${sects}</section>`;
}

function outcomeBeat(e) {
  return `<section class="beat outcome">
    <h2>${esc(e.headline)}</h2>
    <p class="detail">${esc(e.detail)}</p>
    <div class="roster">${e.scores.map(s => `
      <div class="rrow">${avatar(s.slot)}<span class="nm">${esc(nameOf(s.slot))}</span>
        ${roleBadge(s.slot)}<span class="sc">${s.score}</span></div>`).join('')}
    </div>
  </section>`;
}

function holdBeat() {
  return `<div class="beat hold">
    <p class="big">The village sleeps. Nothing is published until dawn.</p>
    <p class="why">The night runs its full fixed length whether or not anyone acts. No pending-action count, no readiness, no timing &mdash; and no gap in the event sequence. A night in which nothing happened must look exactly like this one.</p>
  </div>`;
}

function renderFloor(rawEvs, m) {
  const evs = coalesce(rawEvs);
  const out = [];
  let i = 0;
  while (i < evs.length) {
    const e = evs[i];
    if (e.kind === 'phase' && e.phase === 'night') {
      const body = [];
      let j = i + 1;
      while (j < evs.length && evs[j].day === e.day && evs[j].phase === 'night') body.push(evs[j++]);
      out.push(body.length
        ? nightScene(e, body)
        : `<div class="beat phase" data-phase="night"><span class="mark">Night ${e.day}</span><span class="narr">${esc(e.text)}</span></div>` + holdBeat());
      i = j; continue;
    }
    if (e.kind === 'phase') {
      const label = e.phase === 'vote' ? 'The vote' : e.phase === 'finished' ? 'Finished' : `Day ${e.day}`;
      out.push(`<div class="beat phase" data-phase="${e.phase}"><span class="mark">${esc(label)}</span><span class="narr">${esc(e.text)}</span></div>`);
    }
    else if (e.kind === 'speech') out.push(speechBeat(e, rawEvs));
    else if (e.kind === 'vote_close') out.push(tallyBeat(e));
    else if (e.kind === 'elimination' || e.kind === 'death_notice') out.push(knell(e, m.roles));
    else if (e.kind === 'outcome') out.push(outcomeBeat(e));
    else out.push(revealBeat(e));
    i++;
  }
  if (!out.length) out.push('<div class="beat hold"><p class="big">The episode has not begun.</p></div>');
  document.getElementById('floor').innerHTML = out.join('');
}

/* --------------------------------------- what the browser is actually holding */
function renderCensus() {
  const d = data();
  const by = {};
  for (const e of d.events) by[e.reveal] = (by[e.reveal] || 0) + 1;
  const priv = d.events.length - (by.public || 0);
  const roles = d.seats.some(s => 'role' in s);

  document.getElementById('protohint').innerHTML =
    `<code>${esc(d.projection)}</code> &middot; ${d.events.length} events &middot; `
    + `<b style="color:${priv ? 'var(--seal)' : 'var(--town)'}">${priv} private</b> &middot; `
    + `roles on roster: <b style="color:${roles ? 'var(--seal)' : 'var(--town)'}">${roles ? 'yes' : 'no'}</b>`;

  const rows = Object.entries(by).map(([k, v]) =>
    `<tr><td><code>${esc(k)}</code></td><td>${v}</td><td>${esc(REVEAL_LABEL[k] || k)}</td></tr>`).join('');

  document.getElementById('census').innerHTML = `
    <table>
      <tr><th>Artifact</th><td colspan="2"><code>${esc(d.projection)}</code> &middot; ${JSON.stringify(d).length} bytes &middot; ${d.complete ? 'complete' : 'in progress'}</td></tr>
      <tr><th>Roles</th><td colspan="2">${roles ? 'present on the roster from the first frame' : 'not present in these bytes at all'}</td></tr>
      ${rows}
    </table>
    <p style="margin:0">${roles
      ? 'This bundle contains every revealed category. Switching Reveal to <b>As it aired</b> changes what is drawn, not what the viewer holds — it is a viewing preference, never a secrecy boundary. Secrecy happened server-side, in <code>project.mjs</code>, before these bytes existed.'
      : 'Nothing private reached this browser. There is no role, no wolf chat, no confessional and no sequence gap to count — the live artifact was projected before serialization.'}</p>`;

  const deps = document.getElementById('deps');
  deps.innerHTML = (d.reconciliationNotes || []).map(n => `<li>${esc(n)}</li>`).join('');
}

function renderChrome(m) {
  const d = data(), live = state.source === 'live';
  document.getElementById('ep-title').textContent = d.title;
  document.getElementById('ep-sub').textContent = `${d.episodeId} · ${d.variant}`;

  const st = document.getElementById('status');
  st.dataset.live = String(live);
  document.getElementById('status-text').textContent = live
    ? `Live · ${m.phase === 'night' ? `night ${m.day}` : m.phase === 'vote' ? `day ${m.day} vote` : `day ${m.day}`}`
    : m.finished ? 'Replay · complete' : 'Replay';

  document.querySelectorAll('.seg[data-kind="source"] button').forEach(b => b.setAttribute('aria-pressed', String(b.value === state.source)));
  document.querySelectorAll('.seg[data-kind="reveal"] button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.value === state.reveal && !live));
    b.disabled = live;
  });
  document.getElementById('reveal-hint').textContent = live
    ? 'No private material was sent to this browser, so there is nothing here to reveal.'
    : 'A viewing preference, not a lock. The bundle already contains every allowlisted reveal.';

  ['play', 'prev', 'next', 'tlabel'].forEach(id => { document.getElementById(id).hidden = live; });
  document.querySelector('.timeline').hidden = live;
  document.getElementById('livebar').hidden = !live;
  const scrub = document.getElementById('scrub');
  scrub.max = maxSeq(); scrub.value = Math.min(state.cursor, maxSeq());
  document.getElementById('tlabel').textContent =
    m.finished ? 'End of episode' : m.phase === 'night' ? `Night ${m.day}` : m.phase === 'vote' ? `Day ${m.day} · vote` : `Day ${m.day}`;
  document.getElementById('play').textContent = state.playing ? '❚❚' : '▶';

  const segs = [];
  for (const e of d.events) {
    const k = e.day + ':' + e.phase, last = segs[segs.length - 1];
    if (last && last.k === k) { last.n++; last.end = e.seq; }
    else segs.push({ k, n: 1, phase: e.phase, end: e.seq });
  }
  document.getElementById('segments').innerHTML = segs.map(x =>
    `<span class="sgm" data-phase="${x.phase}" data-past="${state.cursor >= x.end}" style="flex:${x.n}"></span>`).join('');
}

function render() {
  if (state.source === 'live') { state.reveal = 'aired'; state.cursor = Infinity; }
  state.cursor = Math.min(state.cursor, maxSeq());
  const evs = shown();
  const m = derive(evs);
  renderChrome(m);
  renderCensus();
  renderSeats(m);
  renderFloor(evs, m);
  const fl = document.getElementById('floor');
  const pin = () => { fl.scrollTop = fl.scrollHeight; };
  pin(); requestAnimationFrame(pin); setTimeout(pin, 0); setTimeout(pin, 400);
}

/* ------------------------------------------------------------------ wiring */
document.querySelectorAll('.seg[data-kind="source"] button').forEach(b =>
  b.addEventListener('click', () => { state.source = b.value; state.cursor = Infinity; state.playing = false; render(); }));
document.querySelectorAll('.seg[data-kind="reveal"] button').forEach(b =>
  b.addEventListener('click', () => { state.reveal = b.value; render(); }));

const scrub = document.getElementById('scrub');
const step = d => { state.cursor = Math.max(1, Math.min(maxSeq(), state.cursor + d)); render(); };
scrub.addEventListener('input', () => { state.cursor = +scrub.value; state.playing = false; render(); });
document.getElementById('prev').addEventListener('click', () => step(-1));
document.getElementById('next').addEventListener('click', () => step(1));
document.getElementById('play').addEventListener('click', () => { state.playing = !state.playing; render(); });

setInterval(() => {
  if (!state.playing || state.source === 'live') return;
  if (state.cursor >= maxSeq()) { state.playing = false; render(); return; }
  state.cursor++; render();
}, 1400);

addEventListener('keydown', ev => {
  if (state.source === 'live' || /^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
  if (ev.key === 'ArrowRight') step(1);
  else if (ev.key === 'ArrowLeft') step(-1);
  else if (ev.key === ' ') { ev.preventDefault(); state.playing = !state.playing; render(); }
  else if (ev.key === 'Home') { state.cursor = 1; render(); }
  else if (ev.key === 'End') { state.cursor = maxSeq(); render(); }
});

/* deep links, for capturing evidence at exact states */
const q = new URLSearchParams(location.search);
if (q.get('source')) state.source = q.get('source');
if (q.get('reveal')) state.reveal = q.get('reveal');
if (q.get('cursor')) state.cursor = +q.get('cursor');
if (q.get('deps')) document.querySelector('.deps').open = true;
render();
if (q.get('open')) q.get('open').split(',').forEach(i => {
  const el = document.querySelectorAll('.seat')[+i]; if (el) el.open = true;
});
</script>
</body>
</html>
